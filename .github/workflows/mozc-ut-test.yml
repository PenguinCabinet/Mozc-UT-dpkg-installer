name: mozc-ut-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conversion-test:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare container + enable deb-src (required for apt-src / build-dep)
        run: |
          set -eux
          apt-get update
          # install.sh が使う sudo / killall と、テストに使う pgrep / python3 を用意する
          apt-get install -y sudo procps psmisc python3
          # mozc_server は root 起動を拒否する (exit 255) ため、テスト用ユーザを用意する
          if ! id mozctest >/dev/null 2>&1; then
            if command -v useradd >/dev/null 2>&1; then
              useradd -m mozctest
            else
              adduser --disabled-password --gecos '' mozctest
            fi
          fi
          if ls /etc/apt/sources.list.d/*.sources >/dev/null 2>&1; then
            # DEB822 format (Debian bookworm/trixie, Ubuntu 24.04+)
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/*.sources
            grep -H "^Types:" /etc/apt/sources.list.d/*.sources || true
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '/^# deb-src/s/^# //' /etc/apt/sources.list || true
          fi
          sudo apt update

      - name: Install raw Mozc + emacs helper (for conversion test)
        run: |
          set -eux
          sudo apt install -y ibus-mozc mozc-server mozc-data emacs-mozc-bin || \
            sudo apt install -y ibus-mozc mozc-server mozc-data emacs-mozc
          which mozc_emacs_helper || true
          find /usr -name 'mozc_*helper*' 2>/dev/null || true
          find /usr -name mozc_server -type f 2>/dev/null || true

      - name: Test raw Mozc (must NOT contain the UT phrase)
        run: |
          set -eu
          TARGET="やはり俺の青春ラブコメはまちがっている"
          # mozc_server は root 起動を拒否するため、サーバもクライアントも
          # テスト用ユーザ (mozctest) で動かす。IPC の鍵ファイルは HOME 配下で
          # 共有されるため、両者のユーザ・HOME を一致させる必要がある。
          rm -f /tmp/mozc_server_raw.log
          sudo -H -u mozctest bash tests/start_mozc_server.sh /tmp/mozc_server_raw.log
          set +e
          sudo -H -u mozctest python3 tests/check_mozc_candidate.py --expected "$TARGET"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::テストの前提が間違っています: 生のmozcの候補に '$TARGET' が含まれています"
            exit 1
          elif [ "$code" -eq 1 ]; then
            echo "OK: 生のmozcの候補に '$TARGET' は含まれていません"
          else
            echo "::error::変換テスト自体が失敗しました (exit=$code)"
            exit "$code"
          fi

      - name: Run install.sh (ibus)
        run: |
          set -eux
          bash install.sh ibus
          ls -l mozc-ut/dpkg/ || true

      - name: Test patched Mozc (must contain the UT phrase)
        run: |
          set -eu
          TARGET="やはり俺の青春ラブコメはまちがっている"
          rm -f /tmp/mozc_server_patched.log
          sudo -H -u mozctest bash tests/start_mozc_server.sh /tmp/mozc_server_patched.log
          sudo -H -u mozctest python3 tests/check_mozc_candidate.py --expected "$TARGET"
          echo "OK: 適用済みmozcの候補に '$TARGET' が含まれています"

      - name: Dump debug info on failure
        if: failure()
        run: |
          echo '--- server logs ---'
          cat /tmp/mozc_server_*.log 2>/dev/null || true
          echo '--- profile logs ---'
          cat /home/mozctest/.mozc/*.log 2>/dev/null || echo '(no profile logs)'
          echo '--- mozc packages ---'
          dpkg -l 2>/dev/null | grep -i mozc || true
          echo '--- data dir ---'
          ls -l /usr/share/mozc 2>/dev/null || true
          echo '--- mozc-data files ---'
          dpkg -L mozc-data 2>/dev/null | head -50 || true
          echo '--- mozc-server files ---'
          dpkg -L mozc-server 2>/dev/null | head -30 || true
          echo '--- profile dirs ---'
          ls -la /home/mozctest/.mozc 2>/dev/null || true
          ls -la ~/.mozc 2>/dev/null || true
          echo '--- processes ---'
          pgrep -a mozc || true
